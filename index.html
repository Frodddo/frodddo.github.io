<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frodddo | Personal Homepage</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #e6edf3;
      background: linear-gradient(135deg, #0d1117, #161b22);
    }

    .card {
      width: min(680px, 85%);
      padding: 48px;
      border: 1px solid #30363d;
      border-radius: 20px;
      background: rgba(22, 27, 34, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 42px;
    }

    h2 {
      margin-top: 32px;
      color: #58a6ff;
    }

    p {
      line-height: 1.8;
      color: #b1bac4;
    }

    .skills img {
      max-width: 100%;
    }

    .links a {
      display: inline-block;
      margin: 8px 12px 0 0;
      padding: 10px 18px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      background: #238636;
    }

    .links a:hover {
      background: #2ea043;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Hi, I'm Frodddo 👋</h1>
    <p>
      🎓 Master's student in Computer Science at Fudan University<br>
      🏫 B.Sc. in Computer Science from Shanghai University<br>
      🤖 Researching AI Agents and Cloud Native technologies<br>
      🏸 Badminton · Swimming · Cycling<br>
      🎮 Apex Legends
    </p>

    <h2>Tech Stack</h2>

    <div class="skills">
      <img
        src="https://skillicons.dev/icons?i=cpp,python,go,java,linux,docker,kubernetes,git,github,vscode"
        alt="Tech Stack"
      >
    </div>

    <h2>Contact Me</h2>

    <div class="links">
      <a href="https://blog.csdn.net/Frodddo?type=blog" target="_blank">
        CSDN Blog
      </a>

      <a href="mailto:xodongcs@163.com">
        Email Me
      </a>
    </div>
  </main>
</body>
</html>
